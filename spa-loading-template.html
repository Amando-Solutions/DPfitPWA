<!--
  First paint before the app boots. Deliberately matches the splash screen so
  the transition into the app is invisible.

  This markup can render before the app's stylesheet is live, so it carries its
  own copy of the two palettes rather than reading design tokens. It keys off
  the `data-theme` attribute that the inline boot script in `nuxt.config.ts`
  puts on <html> — so a dark-mode member never gets a white flash.
-->
<div class="dp-boot">
  <div class="dp-boot__mark" role="img" aria-label="DP Fitness"></div>
  <div class="dp-boot__accent"></div>
  <div class="dp-boot__track"><div class="dp-boot__fill"></div></div>
</div>

<style>
  .dp-boot {
    --boot-bg: #fbf6f2;
    --boot-accent: #c81e5c;
    --boot-track: rgba(36, 27, 46, 0.12);
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--boot-bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [data-theme="dark"] .dp-boot {
    --boot-bg: #14101a;
    --boot-accent: #ef4b7d;
    --boot-track: rgba(245, 240, 234, 0.14);
  }
  /*
    Two exports of the same lockup, picked by theme: the light file sets
    "FITNESS" in ink for the cream background, the dark file sets it in cream
    for the near-black one. The pink "DP" is identical in both.

    Driving it from `background-image` rather than an <img> means only the rule
    that matches `data-theme` ever fetches a file — two <img> tags with one
    hidden would pull both down. Both share a 2.883:1 canvas, so a single
    width/height fits either; `contain` keeps them honest if that ever changes.
  */
  .dp-boot__mark {
    width: 190px;
    height: 66px;
    background: url("/DP_wordmark_light.png") center / contain no-repeat;
  }
  [data-theme="dark"] .dp-boot__mark {
    background-image: url("/DP_wordmark_dark.png");
  }
  .dp-boot__accent {
    width: 52px;
    height: 4px;
    border-radius: 999px;
    background: var(--boot-accent);
  }
  .dp-boot__track {
    width: 68px;
    height: 4px;
    border-radius: 999px;
    background: var(--boot-track);
    overflow: hidden;
  }
  .dp-boot__fill {
    width: 40%;
    height: 100%;
    border-radius: 999px;
    background: var(--boot-accent);
    animation: dp-boot-slide 1.1s ease-in-out infinite;
  }
  @keyframes dp-boot-slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
</style>
