<!--
  First paint, before the app boots, and the splash screen itself.

  `/` has no screen of its own any more: it redirects straight to wherever the
  member left off, so this markup is the only splash there is. It carries the
  design's full boot frame (corner art, lockup, tagline, loading bar) and is
  torn down by Nuxt the moment the destination screen is ready, which is why
  the member sees it exactly once instead of it handing over to a second,
  identical-looking Vue screen.

  This markup can render before the app's stylesheet is live, so it carries its
  own copy of the two palettes rather than reading design tokens. It keys off
  the `data-theme` attribute that the inline boot script in `nuxt.config.ts`
  puts on <html>, so a dark-mode member never gets a white flash.
-->
<div class="dp-boot">
  <!-- Corner art, in the design's paint order: both discs, then the rings
       over them. -->
  <div class="dp-boot__glow dp-boot__glow--rose"></div>
  <div class="dp-boot__glow dp-boot__glow--violet"></div>
  <div class="dp-boot__ring dp-boot__ring--top"></div>
  <div class="dp-boot__ring dp-boot__ring--bottom"></div>

  <div class="dp-boot__center">

<style>
  .dp-boot {
    /*
      The corner art is authored at the design frame's 412 x 892, so every size
      and offset below is that file's number. `--art` scales the whole set
      together on the wider desktop surface. Change it, not the geometry.
    */
    --art: 1;
    /* The app's light palette, inlined: --surface, --text, --rose-fill and the
       three splash-art colours. Keep in step with `assets/styles/main.css`. */
    --boot-bg: #f3eae4;
    --boot-ink: #241b2e;
    /* The logo's plum. Mirrors `--brand-mark` in the design system. */
    --boot-mark: #430f32;
    /* amando's terracotta, for the credit. Mirrors `--credit-mark`. */
    --boot-credit: #8f4d2a;
    --boot-accent: #c81e5c;
    --boot-glow-rose: rgba(200, 30, 92, 0.5);
    --boot-glow-violet: rgba(36, 27, 46, 0.8);
    --boot-ring: rgba(200, 30, 92, 0.7);

    position: fixed;
    inset: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--boot-bg);
    /* Matches `--font-data`. The webfont arrives with `display=swap`, so this
       may paint in the fallback for a frame, and the fallback is the same stack
       the app itself falls back to. */
    font-family: "Space Mono", ui-monospace, monospace;
  }

  [data-theme="dark"] .dp-boot {
    --boot-bg: #14101a;
    --boot-ink: #f5f0ea;
    /* On the near-black the brand's own answer is the all-white lockup, so the
       mark stops being plum and joins the wordmark. */
    --boot-mark: #f5f0ea;
    /* The terracotta lifts here rather than flipping: #8f4d2a is 2.5:1 on this
       ground, so the credit would read as a smudge. Same hue, higher value. */
    --boot-credit: #c4794f;
    --boot-accent: #d6295f;
    --boot-glow-rose: rgba(255, 134, 168, 0.5);
    /* Dark mode flips the violet disc from ink to a lifted mauve, because a glow that
       darkens is invisible on a dark page. */
    --boot-glow-violet: rgba(150, 132, 172, 0.35);
    --boot-ring: rgba(255, 134, 168, 0.6);
  }

  .dp-boot__glow,
  .dp-boot__ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  /* Solid discs behind a heavy blur, not radial gradients: a gradient starts
     fading at its own centre, which reads as haze rather than as light. */
  .dp-boot__glow--rose {
    width: calc(330px * var(--art));
    height: calc(330px * var(--art));
    top: calc(-180px * var(--art));
    right: calc(-178px * var(--art));
    background: var(--boot-glow-rose);
    filter: blur(calc(32px * var(--art)));
  }

  .dp-boot__glow--violet {
    width: calc(360px * var(--art));
    height: calc(360px * var(--art));
    bottom: calc(-130px * var(--art));
    left: calc(-220px * var(--art));
    background: var(--boot-glow-violet);
    filter: blur(calc(38px * var(--art)));
  }

  /* Hairline rings, each roughly concentric with the disc it sits over. */
  .dp-boot__ring {
    width: calc(250px * var(--art));
    height: calc(250px * var(--art));
    border: 1px solid var(--boot-ring);
  }

  .dp-boot__ring--top {
    top: calc(-72px * var(--art));
    right: calc(-134px * var(--art));
  }

  .dp-boot__ring--bottom {
    bottom: calc(-72px * var(--art));
    left: calc(-134px * var(--art));
  }

  .dp-boot__center {
    position: relative;
    z-index: 1;
    margin: auto;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  /*
    Drawn rather than fetched, which is the whole point of it being here: the
    splash is the very first paint, and an inline path costs no request at all
    where the two PNG exports this replaced cost one that could not even start
    until the theme was known. Both colourways now fall out of the palette
    above — the wordmark takes `--boot-ink` through `currentColor` and the mark
    takes `--boot-mark` — so there is nothing left to preload and nothing to
    swap. 119:93 is the artwork's own ratio.
  */
  .dp-boot__mark {
    /* 270 x 227 is the lockup's own ratio. The height is held at the 92px the
       frame was laid out around, so the accent bar and tagline keep their
       rhythm, and the width follows from it. The mark reads larger than it did
       against the old artwork, which is right: the DP moved out of the
       wordmark and into the mark, so the mark is now carrying it alone. */
    width: 109px;
    height: 92px;
    color: var(--boot-ink);
  }

  .dp-boot__accent {
    width: 52px;
    height: 4px;
    border-radius: 999px;
    background: var(--boot-accent);
  }

  /*
    9px / 12px, which is the same ratio `PoweredBy` builds from its `size` --
    the words set at 0.72 of the wordmark's height, so the label's cap height
    matches the wordmark's x-height and the two read as one line. 117:21 is the
    artwork's own ratio, so 12px tall is 66.9px wide.
  */
  .dp-boot__credit {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 9px;
    line-height: 1;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--boot-ink);
  }

  /* Only the words are held back. Fading the whole credit would take the
     terracotta with it, and a washed-out brand colour reads as a mistake. */
  .dp-boot__credit-label {
    opacity: 0.55;
  }

  .dp-boot__credit-mark {
    width: 66.9px;
    height: 12px;
    color: var(--boot-credit);
  }

  .dp-boot__tagline {
    margin: 0;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.15px;
    font-size: 9.5px;
    line-height: 14px;
    color: var(--boot-ink);
  }

  /*
    Two rows now: the bar, and the credit under it. The bottom padding drops
    from 72px to 34px to pay for the credit's own height and the gap, which
    leaves the loading bar within a few pixels of where it sat before — the
    frame's composition is unchanged, it just grew a floor.
  */
  .dp-boot__loading {
    position: relative;
    z-index: 1;
    padding-bottom: calc(34px + env(safe-area-inset-bottom, 0px));
    display: grid;
    justify-items: center;
    gap: 22px;
  }

  .dp-boot__track {
    width: 68px;
    height: 4px;
    border-radius: 999px;
    background: var(--boot-ink);
    overflow: hidden;
  }

  /*
    Indeterminate rather than a bar filling to 100%: this frame lives for
    however long boot actually takes, which nothing here knows in advance. A
    fixed-duration fill would either finish early and sit at full, reading as
    stuck, or still be crawling when the app replaces it. The slide is
    composited (`transform` only), so it stays smooth through the busiest
    moment in the app's life.
  */
  .dp-boot__fill {
    width: 40%;
    height: 100%;
    border-radius: 999px;
    background: var(--boot-accent);
